---
compose_root: "/home/{{ ansible_user }}/docker"

# Image versions
adguard_version: v0.107.73
rustdesk_version: latest
cadvisor_version: v0.55.1
pve_exporter_version: latest
loki_version: 3.7.9

# RustDesk: address clients use to reach the relay (hbbr)
rustdesk_relay_host: "{{ ansible_default_ipv4.address }}"

# VPN interface: Docker must start after it, because Loki binds to its address
vpn_interface: wg0
docker_after_units:
  - "wg-quick@{{ vpn_interface }}.service"

# Loki: log store queried by Grafana over the VPN; Alloy on each host pushes to it.
# No authentication is configured, so it listens on the VPN address only.
loki_bind_address: "{{ ansible_facts[vpn_interface]['ipv4']['address'] }}"
loki_retention: 720h   # 30 days

# Proxmox exporter: read-only API token (PVEAuditor role)
pve_exporter_user: prometheus@pve
pve_exporter_token_name: exporter
pve_exporter_verify_ssl: false

compose_stacks:
  - name: adguardhome
  - name: rustdesk
  - name: cAdvisor
  - name: Loki
    files:
      - { dest: loki-config.yaml }
  - name: pve-exporter
    files:
      # uid 101 = "prometheus" user inside the exporter image
      - { dest: pve.yml, owner: "101", group: root, mode: "0600", secret: true }
