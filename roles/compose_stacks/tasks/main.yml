---
# Each stack lives in <compose_root>/<name>/ with a compose.yaml rendered
# from templates/<name>/compose.yml.j2, plus any extra config files it needs
# (secrets come from ansible-vault and are never committed in clear).
- name: Create stack directories
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ item.name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ compose_stacks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy compose files
  ansible.builtin.template:
    src: "{{ item.name }}/compose.yml.j2"
    dest: "{{ compose_root }}/{{ item.name }}/compose.yaml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  loop: "{{ compose_stacks }}"
  loop_control:
    label: "{{ item.name }}"

# compose.yaml takes precedence; drop the legacy name to avoid confusion.
- name: Remove legacy docker-compose.yml files
  ansible.builtin.file:
    path: "{{ compose_root }}/{{ item.name }}/docker-compose.yml"
    state: absent
  loop: "{{ compose_stacks }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy extra config files
  ansible.builtin.template:
    src: "{{ item.0.name }}/{{ item.1.dest }}.j2"
    dest: "{{ compose_root }}/{{ item.0.name }}/{{ item.1.dest }}"
    owner: "{{ item.1.owner | default(ansible_user) }}"
    group: "{{ item.1.group | default(ansible_user) }}"
    mode: "{{ item.1.mode | default('0644') }}"
  loop: "{{ compose_stacks | subelements('files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}/{{ item.1.dest }}"
  no_log: "{{ item.1.secret | default(false) }}"

- name: Start stacks
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/{{ item.name }}"
    state: present
  loop: "{{ compose_stacks }}"
  loop_control:
    label: "{{ item.name }}"
